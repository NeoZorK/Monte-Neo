site_name: Monte-Neo
site_description: Fast local research for trading strategies on Apple Silicon
site_url: https://neozork.github.io/Monte-Neo/
repo_url: https://github.com/NeoZorK/Monte-Neo
repo_name: NeoZorK/Monte-Neo
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

docs_dir: docs
site_dir: site

nav:
  - Home: INDEX.md
  - FAQ: guides/FAQ.md
  - Setup:
      - Installation: setup/installation.md
      - Development: setup/development-setup.md
  - Project:
      - Changelog: project/CHANGELOG.md
      - Roadmap: project/ROADMAP.md
      - Packaging: project/PACKAGING.md
      - Branching: project/BRANCHING.md
  - Commercial: en/COMMERCIAL.md
