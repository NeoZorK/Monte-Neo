site_name: Monte-Neo
site_description: Verify trading strategies before you trust them — look-ahead, costs, Deflated Sharpe, MCP for coding agents
site_url: https://neozork.github.io/Monte-Neo/
repo_url: https://github.com/NeoZorK/Monte-Neo
repo_name: NeoZorK/Monte-Neo
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; NeoZorK — MIT License.
  <br>Not investment advice. Monte-Neo is a research and verification tool: its reports, examples and
  reference strategies illustrate a method, not a recommendation or a call to trade, and not a promise of profit.
  Simulated and past results do not predict future returns. Trading can lose money.

theme:
  name: material
  logo: assets/logo-icon.svg
  favicon: assets/logo-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - assets/verify-certificate.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NeoZorK/Monte-Neo
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/monte-neo/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Get started:
      - Install: setup/installation.md
      - Quick start: guides/quick-start.md
      - Example reports: gallery.md
      - Verify a certificate: verify.md
      - FAQ: guides/FAQ.md
  - Agents and integrations:
      - Use from agents: guides/agents.md
      - Local agents: guides/local-agents.md
      - Frameworks and notebooks: guides/frameworks.md
      - Project tools: guides/workflow-tools.md
      - Honesty Bench: guides/honesty-bench.md
      - Honesty scorecard: guides/honesty-scorecard.md
  - Verify a backtest:
      - Trap Suite: guides/trap-suite.md
      - Checks added after the audit: guides/verifier-gaps.md
      - Coverage limits: guides/coverage-limits.md
      - Latency audit (quotes): guides/arrival-time.md
      - Repainting: guides/repaint.md
      - Ledger and fixes: guides/ledger-and-fixes.md
      - Policy, trials, model cutoff: guides/policy-trials-cutoff.md
      - ML models and event data: guides/ml-and-events.md
      - Repair without overfitting: guides/repair.md
  - Strategy types:
      - Strategy-type profiles: guides/profiles.md
      - Options verification: guides/options.md
      - Phantom profit in pairs strategies: guides/phantom-profit.md
      - Econometric checks for pairs: guides/pairs-econometrics.md
      - Delta-neutral carry: guides/carry.md
  - Alpha and readiness:
      - Alpha validation: guides/alpha.md
      - ARL and depth: guides/arl.md
      - Dossier, readiness, live monitor: guides/dossier-readiness-monitor.md
      - Track record due diligence: guides/returns-due-diligence.md
      - Reference alpha: guides/reference-alpha.md
      - Alpha calibration: guides/alpha-calibration.md
      - ARL calibration: guides/arl-calibration.md
  - Research:
      - Honest strategy search: guides/research.md
      - Indicator search: guides/discover.md
      - Discover calibration: guides/discover-calibration.md
      - Real data and wild scan: guides/real-data-and-wild-corpus.md
  - Catalog:
      - Strategy catalog: catalog/README.md
      - Index of 100 strategies: catalog/INDEX.md
      - Strategy types: catalog/TYPES.md
      - Taxonomy (planned): catalog/TAXONOMY.md
      - Verified results: catalog/RESULTS.md
      - What did not work: catalog/WHAT_DID_NOT_WORK.md
      - Protocol: catalog/PROTOCOL.md
      - Public registry: catalog/REGISTRY.md
      - Hall of Fame (table): hall-of-fame.md
      - Hall of Fame (guide): guides/hall-of-fame.md
  - Articles:
      - Six ways your agent's backtest lies: marketing/article-six-ways.md
      - Papers: paper/papers.md
      - Technical note (method): paper/methodology.md
  - API:
      - Strategy verifier: api/verify.md
  - Research engine (frozen):
      - Research export: api/export.md
      - Research policy: api/policy.md
      - Holdout: api/holdout.md
      - Research performance: development/performance.md
  - Project:
      - Changelog: project/CHANGELOG.md
      - Roadmap: project/ROADMAP.md
      - Contributing: development/contributing.md
      - Packaging: project/PACKAGING.md
      - Branching: project/BRANCHING.md
      - Docs map: docs-map.md
      - Security: https://github.com/NeoZorK/Monte-Neo/blob/main/SECURITY.md
      - Code of conduct: https://github.com/NeoZorK/Monte-Neo/blob/main/CODE_OF_CONDUCT.md
      - Accessibility: https://github.com/NeoZorK/Monte-Neo/blob/main/ACCESSIBILITY.md
  - Commercial: en/COMMERCIAL.md

exclude_docs: |
  internal/
