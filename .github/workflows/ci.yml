name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra apple --extra plot --extra data --extra mcp --extra sign --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Run unit tests
        run: uv run pytest tests/unit -W ignore

      - name: Run verifier Trap Suite
        run: uv run pytest tests/traps -W ignore

  # The verifier (CLI, MCP server, GitHub Action, bench) is pure Python: check it on the
  # platform and Python versions users install it on, not only on the Apple research stack.
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra mcp --extra sign --group dev

      - name: Verifier tests and Trap Suite
        run: >-
          uv run pytest -W ignore tests/traps tests/unit/test_bench_*.py tests/unit/test_verify_*.py
          tests/unit/test_integrations.py tests/unit/test_maintenance.py

  # The docs site is built with --strict on every push to main: a broken link must fail the pull
  # request, not the deployment after the merge.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build the docs site (strict)
        run: |
          pip install --require-hashes --no-deps -r scripts/requirements/docs.txt
          mkdocs build --strict
