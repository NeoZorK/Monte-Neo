name: Docker image

# Manual rebuild of the verifier image for a release that is already on PyPI. Releases build it in
# publish.yml (the "docker" job); this workflow is for re-running it by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to build, e.g. v0.44.0 (must already be on PyPI)"
        required: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The default branch: only docker/verify and the script are used, the release comes from PyPI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build, test and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version }}
        run: bash scripts/build_docker_image.sh "$TAG"
