name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg=$(python -c "import re; print(re.search(r'__version__ = \"(v[^\"]+)\"', open('src/monte_neo/_version.py').read()).group(1))")
          test "$pkg" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package $pkg"; exit 1; }
      - name: Build
        run: |
          pip install --require-hashes --no-deps -r scripts/requirements/build.txt
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  pypi-smoke:
    # Install the version just published and run it like a user (release events made with
    # GITHUB_TOKEN do not trigger other workflows, so the check runs here).
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install from PyPI and run the product
        env:
          VERIFY_PYPI_MAX_ATTEMPTS: "10"
          VERIFY_PYPI_SLEEP_SECS: "30"
        run: bash scripts/verify_pypi_install.sh "$GITHUB_REF_NAME"

  docker:
    # The verifier image on GHCR, built from the release just published (see scripts/build_docker_image.sh).
    needs: pypi-smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build, test and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build_docker_image.sh "$GITHUB_REF_NAME"

  mcp-registry:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install mcp-publisher
        run: |
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish server.json to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          for i in 1 2 3 4 5; do
            if out=$(./mcp-publisher publish 2>&1); then echo "$out"; exit 0; fi
            echo "$out"
            # 422 = invalid server.json: retrying cannot help
            if echo "$out" | grep -q "status 422"; then exit 1; fi
            echo "retry $i (PyPI propagation)"; sleep $((i * 30))
          done
          exit 1

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Release notes from CHANGELOG
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            index($0, "## [" tag "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' docs/project/CHANGELOG.md > notes.md
          test -s notes.md || echo "See docs/project/CHANGELOG.md" > notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Monte-Neo $GITHUB_REF_NAME" --notes-file notes.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: SBOM of the published package (CycloneDX)
        # Best effort: a failure here must not undo the release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The runtime dependencies come from the hash-locked file (made from uv.lock); the package is the root component.
          # Nothing is installed from the checkout, so no unpinned install runs here.
          python -m pip install -q --require-hashes --no-deps -r scripts/requirements/sbom.txt
          cyclonedx-py requirements --pyproject pyproject.toml --mc-type library --of JSON -o "monte-neo-$version.cdx.json" scripts/requirements/runtime.txt
          # The version of the package is dynamic in pyproject.toml: set it on the root component.
          python - "$version" "monte-neo-$version.cdx.json" <<'PY'
          import json
          import sys

          version, path = sys.argv[1:3]
          bom = json.load(open(path, encoding="utf-8"))
          root = bom["metadata"]["component"]
          root["version"] = version
          root["purl"] = f"pkg:pypi/monte-neo@{version}"
          json.dump(bom, open(path, "w", encoding="utf-8"), indent=2)
          PY
          gh release upload "$GITHUB_REF_NAME" "monte-neo-$version.cdx.json"
