name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg=$(python -c "import re; print(re.search(r'__version__ = \"(v[^\"]+)\"', open('src/monte_neo/_version.py').read()).group(1))")
          test "$pkg" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package $pkg"; exit 1; }
      - name: Build
        run: |
          pip install "build>=1.2" "hatchling>=1.24,<1.26"
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  pypi-smoke:
    # Install the version just published and run it like a user (release events made with
    # GITHUB_TOKEN do not trigger other workflows, so the check runs here).
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install from PyPI and run the product
        env:
          VERIFY_PYPI_MAX_ATTEMPTS: "10"
          VERIFY_PYPI_SLEEP_SECS: "30"
        run: bash scripts/verify_pypi_install.sh "$GITHUB_REF_NAME"

  mcp-registry:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install mcp-publisher
        run: |
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish server.json to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          for i in 1 2 3 4 5; do
            if out=$(./mcp-publisher publish 2>&1); then echo "$out"; exit 0; fi
            echo "$out"
            # 422 = invalid server.json: retrying cannot help
            if echo "$out" | grep -q "status 422"; then exit 1; fi
            echo "retry $i (PyPI propagation)"; sleep $((i * 30))
          done
          exit 1

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Release notes from CHANGELOG
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            index($0, "## [" tag "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' docs/project/CHANGELOG.md > notes.md
          test -s notes.md || echo "See docs/project/CHANGELOG.md" > notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Monte-Neo $GITHUB_REF_NAME" --notes-file notes.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: SBOM of the published package (CycloneDX)
        # Best effort: a failure here must not undo the release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python -m venv sbom-env
          for i in 1 2 3 4 5 6; do
            sbom-env/bin/pip install -q "monte-neo[sign,mcp]==$version" && break
            echo "waiting for PyPI ($i)"; sleep 30
          done
          python -m pip install -q "cyclonedx-bom>=4,<8"
          cyclonedx-py environment sbom-env --of JSON -o "monte-neo-$version.cdx.json"
          gh release upload "$GITHUB_REF_NAME" "monte-neo-$version.cdx.json"
