name: Verify action self-test

on:
  pull_request:
    paths:
      - "action.yml"
      - "src/monte_neo/verify/**"
      - "src/monte_neo/cli/verify_cmd.py"
      - "tests/traps/**"
      - ".github/workflows/verify-action.yml"
      - "src/monte_neo/verify/signing.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build sample OHLCV
        run: |
          python -m pip install --quiet --require-hashes --no-deps -r scripts/requirements/sample-data.txt
          python - <<'PY'
          import numpy as np, pandas as pd
          rng = np.random.default_rng(1)
          close = 100 * np.exp(np.cumsum(rng.normal(0, 0.001, 3000)))
          open_ = np.roll(close, 1); open_[0] = close[0]
          pd.DataFrame({
              "timestamp": pd.date_range("2024-01-01", periods=3000, freq="min", tz="UTC"),
              "open": open_, "high": np.maximum(open_, close) * 1.0005,
              "low": np.minimum(open_, close) * 0.9995, "close": close,
          }).to_csv("sample.csv", index=False)
          PY

      - name: Leaky strategy must be rejected
        id: leaky
        continue-on-error: true
        uses: ./
        with:
          ohlcv: sample.csv
          strategy: tests/traps/strategies/lookahead_shift.py

      - name: Assert rejection
        env:
          OUTCOME: ${{ steps.leaky.outcome }}
          VERDICT: ${{ steps.leaky.outputs.verdict }}
          CERT: ${{ steps.leaky.outputs.certificate }}
        run: |
          echo "outcome=$OUTCOME verdict=$VERDICT"
          test "$OUTCOME" = "failure"
          test "$VERDICT" = "REJECT"
          # n-trials was not given: the certificate must not claim it was declared.
          python -c "import json,sys; c={r['id']: r['status'] for r in json.load(open(sys.argv[1]))['checks']}; assert c['trials_disclosed'] == 'info', c" "$CERT"

      - name: Unknown fail-on is an input error
        id: badfail
        continue-on-error: true
        uses: ./
        with:
          ohlcv: sample.csv
          strategy: tests/traps/strategies/sma_cross.py
          fail-on: WHATEVER

      - name: Assert input error
        env:
          OUTCOME: ${{ steps.badfail.outcome }}
          VERDICT: ${{ steps.badfail.outputs.verdict }}
        run: |
          test "$OUTCOME" = "failure"
          test -z "$VERDICT"

      - name: Create a throwaway signing key
        id: key
        run: |
          python -m pip install --quiet --require-hashes --no-deps -r scripts/requirements/signing-key.txt
          python - <<'PY' > key.pem
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ed25519
          k = ed25519.Ed25519PrivateKey.generate()
          print(k.private_bytes(serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8,
                                serialization.NoEncryption()).decode(), end="")
          PY
          {
            echo "pem<<MN_PEM_EOF"
            cat key.pem
            echo "MN_PEM_EOF"
          } >> "$GITHUB_OUTPUT"
          rm key.pem

      - name: Honest strategy with a signed certificate
        id: signed
        uses: ./
        with:
          ohlcv: sample.csv
          strategy: tests/traps/strategies/sma_cross.py
          fail-on: NEEDS_MORE_EVIDENCE
          signing-key: ${{ steps.key.outputs.pem }}
          upload-certificate: "true"
        continue-on-error: true

      - name: Assert the certificate is signed
        env:
          CERT: ${{ steps.signed.outputs.certificate }}
          KEY_ID: ${{ steps.signed.outputs.key-id }}
          HTML: ${{ steps.signed.outputs.html-report }}
        run: |
          echo "key id: $KEY_ID"
          test -n "$KEY_ID"
          monte-neo verify --check-signature "$CERT"
          grep -q "Monte-Neo strategy verdict" "$HTML"
          grep -q "$KEY_ID" "$HTML"
          test ! -e "$RUNNER_TEMP/monte-neo-signing.key"
