name: PyPI install smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: "PyPI version without leading v (empty = script default)"
        required: false
        default: ""
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            V="${INPUT_VERSION#v}"
          elif [ "${EVENT_NAME}" = "release" ] && [ -n "${RELEASE_TAG:-}" ]; then
            V="${RELEASE_TAG#v}"
          else
            # schedule or empty dispatch → latest release on PyPI
            V=""
          fi
          echo "ver=${V}" >> "$GITHUB_OUTPUT"
          if [ -n "${V}" ]; then
            echo "Resolved PyPI version: ${V}"
          else
            echo "Using the latest release on PyPI"
          fi

      - name: Verify PyPI bare install
        env:
          VERIFY_PYPI_MAX_ATTEMPTS: "8"
          VERIFY_PYPI_SLEEP_SECS: "20"
        run: |
          set -euo pipefail
          if [ -n "${{ steps.ver.outputs.ver }}" ]; then
            bash scripts/verify_pypi_install.sh "${{ steps.ver.outputs.ver }}"
          else
            bash scripts/verify_pypi_install.sh
          fi

