name: Security

# Static analysis of the verifier code and an audit of the locked runtime dependencies.
# CodeQL runs separately (repository setting). The weekly run catches advisories published
# after the last push.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Bandit (medium and high findings fail the job)
        run: >-
          uvx "bandit>=1.8,<2" -q -ll -r src

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Known vulnerabilities in the locked runtime dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-dev \
            --extra sign --extra mcp --extra parquet --extra fast -o requirements-audit.txt
          uvx "pip-audit>=2.7,<3" -r requirements-audit.txt --no-deps --disable-pip
