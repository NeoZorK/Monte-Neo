name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: pip install "mkdocs-material>=9.5"
      - name: Build
        run: mkdocs build --strict
      - name: Ensure root index.html for GitHub Pages
        run: |
          # Prefer product landing (docs/home.md → site/home/). Rewrite ../ → ./ so
          # assets/CSS work at site root (cannot use docs/index.md next to INDEX.md on macOS).
          if [ -f site/home/index.html ]; then
            sed -E 's/(href|src)="\.\.\//\1="/g' site/home/index.html > site/index.html
          elif [ -f site/INDEX/index.html ]; then
            sed -E 's/(href|src)="\.\.\//\1="/g' site/INDEX/index.html > site/index.html
          elif [ -f site/INDEX.html ] && [ ! -f site/index.html ]; then
            cp site/INDEX.html site/index.html
          fi
          test -f site/index.html
          grep -q 'stylesheets/extra.css' site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
