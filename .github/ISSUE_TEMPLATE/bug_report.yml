name: Bug report
description: Something broken in install, export, policy, holdout, or Metal path
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce on a clean Mac/Linux env.
  - type: input
    id: version
    attributes:
      label: monte-neo version
      placeholder: "0.17.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.7"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal repro
      description: Commands / short script (no secrets, no private harness dumps)
      render: shell
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Installed extras
      placeholder: "apple, plot, …"
