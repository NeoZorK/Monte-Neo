name: Monte-Neo strategy verify
description: Verify a trading-strategy backtest (look-ahead, costs, selection bias) and fail the job on REJECT.
author: NeoZorK
branding:
  icon: check-circle
  color: blue

inputs:
  ohlcv:
    description: OHLCV table (.csv / .parquet) with open, high, low, close[, timestamp]
    required: true
  strategy:
    description: Strategy file 'path.py[:func]' with func(df) -> positions
    required: false
    default: ""
  signals:
    description: Positions per bar file (.csv / .parquet / .npy), used when no strategy is given
    required: false
    default: ""
  n-trials:
    description: Number of variants tried before choosing this one
    required: false
    default: "1"
  commission-bps:
    description: Commission per side (bps)
    required: false
    default: "5"
  slippage-bps:
    description: Slippage per side (bps)
    required: false
    default: "5"
  grid:
    description: "Parameter grid as JSON (e.g. '{\"fast\": [10, 20]}'); the verifier runs the search and walk-forward"
    required: false
    default: ""
  comment:
    description: "Post (or update) a PR comment with the verdict: 'true' or 'false'. Needs pull-requests: write"
    required: false
    default: "false"
  github-token:
    description: Token used for the PR comment
    required: false
    default: ${{ github.token }}
  fail-on:
    description: "Lowest verdict that fails the job: REJECT (default) or NEEDS_MORE_EVIDENCE"
    required: false
    default: REJECT
  signing-key:
    description: "Ed25519 private key (PEM text) to sign the certificate; pass it from a repository secret such as MONTE_NEO_SIGNING_KEY"
    required: false
    default: ""
  upload-certificate:
    description: "Upload the certificate as a workflow artifact named monte-neo-certificate: 'true' or 'false'"
    required: false
    default: "false"
  python-version:
    description: Python version to run the verifier with
    required: false
    default: "3.11"

outputs:
  verdict:
    description: PASS, PASS_WITH_WARNINGS, NEEDS_MORE_EVIDENCE or REJECT
    value: ${{ steps.verify.outputs.verdict }}
  certificate:
    description: Path of the strategy-verdict/1 JSON certificate
    value: ${{ steps.verify.outputs.certificate }}
  key-id:
    description: Key id of the signature (empty when the certificate is not signed)
    value: ${{ steps.verify.outputs.key-id }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Monte-Neo
      shell: bash
      env:
        MN_SIGN: ${{ inputs.signing-key != '' }}
        MN_PATH: ${{ github.action_path }}
      run: |
        if [ "$MN_SIGN" = "true" ]; then
          python -m pip install --quiet "$MN_PATH[sign]"
        else
          python -m pip install --quiet "$MN_PATH"
        fi
    - name: Verify strategy
      id: verify
      shell: bash
      env:
        MN_OHLCV: ${{ inputs.ohlcv }}
        MN_STRATEGY: ${{ inputs.strategy }}
        MN_SIGNALS: ${{ inputs.signals }}
        MN_TRIALS: ${{ inputs.n-trials }}
        MN_COMMISSION: ${{ inputs.commission-bps }}
        MN_SLIPPAGE: ${{ inputs.slippage-bps }}
        MN_FAIL_ON: ${{ inputs.fail-on }}
        MN_GRID: ${{ inputs.grid }}
        MN_COMMENT: ${{ inputs.comment }}
        MN_PR: ${{ github.event.pull_request.number }}
        MN_SIGNING_KEY: ${{ inputs.signing-key }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set +e
        src=(--signals "$MN_SIGNALS")
        if [ -n "$MN_STRATEGY" ]; then src=(--strategy "$MN_STRATEGY"); fi
        extra=(--n-trials "$MN_TRIALS")
        if [ -n "$MN_GRID" ]; then extra=(--grid "$MN_GRID"); fi
        cert="$RUNNER_TEMP/strategy-verdict.json"
        report="$RUNNER_TEMP/strategy-verdict.md"
        sign=()
        if [ -n "$MN_SIGNING_KEY" ]; then
          key="$RUNNER_TEMP/monte-neo-signing.key"
          (umask 077 && printf '%s\n' "$MN_SIGNING_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          sign=(--sign "$key")
        fi
        monte-neo verify --ohlcv "$MN_OHLCV" "${src[@]}" "${extra[@]}" \
          --commission-bps "$MN_COMMISSION" --slippage-bps "$MN_SLIPPAGE" --out "$cert" "${sign[@]}"
        code=$?
        if [ -n "$MN_SIGNING_KEY" ]; then rm -f "$key"; fi
        if [ "$code" -eq 3 ]; then exit 3; fi
        verdict=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['verdict'])" "$cert")
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "certificate=$cert" >> "$GITHUB_OUTPUT"
        key_id=$(python -c "import json,sys; print((json.load(open(sys.argv[1])).get('signature') or {}).get('key_id', ''))" "$cert")
        echo "key-id=$key_id" >> "$GITHUB_OUTPUT"
        python - "$cert" > "$report" <<'PY'
        import json, sys
        r = json.load(open(sys.argv[1]))
        print("<!-- monte-neo-verdict -->")
        sig = r.get("signature")
        signed = f", signed by key `{sig['key_id']}`" if sig else ""
        print(f"## Monte-Neo verdict: {r['verdict']}\n\nCertificate `{r['certificate_id']}`{signed}\n")
        g = r.get("grid")
        if g:
            wf = g["walk_forward"]
            print(f"Grid: {g['n_combos']} combos, best `{g['best_params']}`, walk-forward OOS Sharpe/bar {wf['oos_sharpe']:+.4f}\n")
        print("| check | status | summary |\n|---|---|---|")
        for c in r["checks"]:
            print(f"| {c['id']} | {c['status']} | {c['summary']} |")
        for a in r["next_actions"]:
            print(f"- {a}")
        PY
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        if [ "$MN_COMMENT" = "true" ] && [ -n "$MN_PR" ]; then
          cid=$(gh api "repos/$GITHUB_REPOSITORY/issues/$MN_PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- monte-neo-verdict -->")) | .id' | tail -n 1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$cid" -F body=@"$report" > /dev/null
          else
            gh pr comment "$MN_PR" --repo "$GITHUB_REPOSITORY" --body-file "$report"
          fi
        fi
        if [ "$code" -eq 2 ]; then exit 2; fi
        if [ "$code" -eq 1 ] && [ "$MN_FAIL_ON" = "NEEDS_MORE_EVIDENCE" ]; then exit 1; fi
        exit 0
    - name: Upload certificate
      if: ${{ always() && inputs.upload-certificate == 'true' && steps.verify.outputs.certificate != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: monte-neo-certificate
        path: ${{ steps.verify.outputs.certificate }}
