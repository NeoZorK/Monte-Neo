[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monte-neo"
dynamic = ["version"]
description = "Monte Carlo Indicator Generator Framework"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
authors = [
    { name = "Monte-Neo Team" }
]
keywords = ["trading", "monte-carlo", "indicators", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=23.0.1",
    "numba>=0.58",
    "ta>=0.10",
    "rich>=13.0",
    "questionary>=2.0",
    "prompt-toolkit>=3.0",
    "plotext>=5.2",
    "mplfinance",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
    "mlx>=0.11.0",
    "pybind11>=2.10.0",
    "binance-connector>=3.12.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.8",
    "redis>=8.0.1",
    "psycopg2-binary>=2.9.12",
    "lightgbm>=4.6.0",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
    "fastapi>=0.138.2",
    "uvicorn>=0.49.0",
    "pyobjc-framework-metal>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-xdist>=3.3",
    "mypy>=1.5",
    "ruff>=0.1",
    "black>=26.3.1",
    "pre-commit>=3.4",
    "pandas-stubs",
    "types-PyYAML",
    "setuptools>=75.0",
]

[project.scripts]
monte-neo = "monte_neo.cli.app:main"

[tool.hatch.version]
path = "src/monte_neo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/monte_neo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
filterwarnings = []

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["no-any-return", "arg-type", "var-annotated", "operator"]

[tool.ruff]
target-version = "py311"
line-length = 120
lint.select = ["E", "F", "I", "N", "W", "UP"]
lint.ignore = ["E501", "E701", "F841", "E741", "W293"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.coverage.run]
source = ["src/monte_neo"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
