[build-system]
requires = ["hatchling>=1.24,<1.26"]
build-backend = "hatchling.build"

[project]
name = "monte-neo"
dynamic = ["version"]
description = "Fast local research for trading strategies on Apple Silicon: fee-aware bar backtests, Monte Carlo, paper OMS (Metal/MLX/Numba)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Monte-Neo Team" }
]
keywords = ["trading", "monte-carlo", "backtesting", "apple-silicon", "metal", "research", "oms"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # Research-core: fee-aware bar export / Metal-Numba path / CLI
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=23.0.1",
    "numba>=0.58",
    "rich>=13.0",
    "questionary>=2.0",
    "prompt-toolkit>=3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
    "pybind11>=2.10.0",
]


[project.optional-dependencies]
apple = [
    "mlx>=0.11.0; sys_platform == 'darwin'",
    "pyobjc-framework-metal>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=12.2.2; sys_platform == 'darwin'",
]
plot = [
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "mplfinance",
    "plotext>=5.2",
    "pillow>=12.3.0",
]
data = [
    "binance-connector>=3.12.0",
]
ml = [
    "lightgbm>=4.6.0",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
    "scipy>=1.11",
    "ta>=0.10",
]
server = [
    "fastapi>=0.138.2",
    "uvicorn>=0.49.0",
    "redis>=8.0.1",
    "psycopg2-binary>=2.9.12",
]
# Back-compat kitchen sink for local/dev parity with pre-0.16 installs
full = [
    "mlx>=0.11.0; sys_platform == 'darwin'",
    "pyobjc-framework-metal>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=12.2.2; sys_platform == 'darwin'",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "mplfinance",
    "plotext>=5.2",
    "pillow>=12.3.0",
    "binance-connector>=3.12.0",
    "lightgbm>=4.6.0",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
    "scipy>=1.11",
    "ta>=0.10",
    "fastapi>=0.138.2",
    "uvicorn>=0.49.0",
    "redis>=8.0.1",
    "psycopg2-binary>=2.9.12",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-xdist>=3.3",
    "mypy>=1.5",
    "ruff>=0.1",
    "black>=26.3.1",
    "pre-commit>=3.4",
    "pandas-stubs",
    "types-PyYAML",
    "setuptools>=75.0",
    "build>=1.2",
    "twine>=5.0",
    # test suite needs plot + exchange client modules
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "mplfinance",
    "plotext>=5.2",
    "pillow>=12.3.0",
    "binance-connector>=3.12.0",
]

[project.urls]
Homepage = "https://github.com/NeoZorK/Monte-Neo"
Repository = "https://github.com/NeoZorK/Monte-Neo"
Issues = "https://github.com/NeoZorK/Monte-Neo/issues"
Changelog = "https://github.com/NeoZorK/Monte-Neo/blob/main/docs/project/CHANGELOG.md"
Documentation = "https://neozork.github.io/Monte-Neo/"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-xdist>=3.3",
    "mypy>=1.5",
    "ruff>=0.1",
    "black>=26.3.1",
    "pre-commit>=3.4",
    "pandas-stubs",
    "types-PyYAML",
    "setuptools>=75.0",
]

[project.scripts]
monte-neo = "monte_neo.cli.app:main"

[tool.hatch.version]
path = "src/monte_neo/_version.py"
pattern = '__version__ = "v(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/monte_neo"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
filterwarnings = []
markers = [
    "stress: larger workloads / longer series",
    "performance: throughput smoke checks (not public claims)",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["no-any-return", "arg-type", "var-annotated", "operator"]

[tool.ruff]
target-version = "py311"
line-length = 120
lint.select = ["E", "F", "I", "N", "W", "UP"]
lint.ignore = ["E501", "E701", "F841", "E741", "W293"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.coverage.run]
source_pkgs = ["monte_neo"]
branch = false
omit = [
    "*/monte_neo/cli/menu/*",
    "*/monte_neo/core/native/metal_engine.py",
    "*/monte_neo/core/mlx_*.py",
    "*/monte_neo/core/gpu_lazy.py",
    "*/monte_neo/core/gpu_scenarios.py",
    "*/monte_neo/core/acceleration/*",
    "*/monte_neo/metrics/numba_funcs.py",
    "*/monte_neo/indicators/numba_funcs.py",
    "*/monte_neo/backtest/core_numba.py",
    "*/monte_neo/oms/accel/match_numba.py",
    "*/monte_neo/oms/accel/match_l2_numba.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
