<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Monte-Neo">
  <title>Monte-Neo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1530"/>
      <stop offset="1" stop-color="#070B1A"/>
    </linearGradient>
    <linearGradient id="ink" x1="96" y1="400" x2="416" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#B26BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4F8CFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4F8CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Monte Carlo fan: many simulated paths leaving one start point -->
  <g fill="none" stroke="url(#ink)" stroke-linecap="round" stroke-width="3" opacity="0.45">
    <path d="M112 372 C 190 372, 230 330, 300 300 S 400 250, 430 150"/>
    <path d="M112 372 C 190 372, 240 360, 310 340 S 400 320, 430 262"/>
    <path d="M112 372 C 180 360, 250 300, 320 250 S 390 190, 430 118"/>
    <path d="M112 372 C 200 380, 260 372, 320 372 S 400 362, 430 332"/>
    <path d="M112 372 C 170 340, 220 280, 290 236 S 380 160, 430 96"/>
  </g>

  <!-- the M: a price path that survives verification -->
  <path d="M112 372 V148 L256 300 L400 148 V372" fill="none" stroke="url(#ink)" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity="0.55"/>
  <path d="M112 372 V148 L256 300 L400 148 V372" fill="none" stroke="url(#ink)" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- verified node -->
  <circle cx="400" cy="372" r="30" fill="#0A1024"/>
  <circle cx="400" cy="372" r="30" fill="none" stroke="#7CF2C6" stroke-width="7"/>
  <path d="M386 372 l10 10 l19 -22" fill="none" stroke="#7CF2C6" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
