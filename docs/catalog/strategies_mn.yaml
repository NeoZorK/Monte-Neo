# Monte-Neo strategy catalog, extension MN-1: market-neutral and arbitrage (draft). Not investment advice.
# Same rules as strategies.yaml: parameters are canonical and FROZEN. Every entry here adds one trial to the catalog:
# the extension is verified with n_trials = 100 + the number of entries below (PROTOCOL.md, "variants added later").
# structure: MN = market-neutral (net exposure near zero), BAS = basis (same asset, two instruments), SPR = spread.
# worst: what can lose money although the book is hedged; the card adds the type's standard list and a
# `monte-neo catalog worst` command. Hedged never means risk-free.
- {id: crypto_basis_reversion, name: Spot-perpetual basis reversion, type: carry, tier: A, structure: BAS, source: "He Manela Ross von Wachter 2022 'Fundamentals of perpetual futures' (arXiv 2212.06888); law of one price", formula: "Per coin, z-score of log(perp/spot) over 60 days; above 2 buy spot and sell the perpetual in equal notional; close both below 0.5; equal capital per coin with 25% margin", params: {window: 60, entry: 2.0, exit: 0.5, margin: 0.25}, data: [spot and perpetual daily closes, funding history], traps: [funding_basis, execution_timing, costs, stale_price], regime: "premia stretch in leveraged bull phases; can stay stretched for weeks", verification: "unverified", worst: "the premium keeps widening while the short perpetual's margin is called in a fast rally; both legs sit on one venue"}
- {id: crypto_pairs_basket, name: Basket of crypto pairs (rolling hedge), type: stat_arb_pairs, tier: A, structure: MN, source: "Gatev Goetzmann Rouwenhorst 2006 RFS (distance pairs) applied to a basket of related perpetuals", formula: "Six pairs (ETH/BTC, SOL/ETH, BNB/BTC, LTC/BTC, LINK/ETH, ADA/XRP): rolling 90-day hedge ratio on log prices; sell the spread above z 2, buy below -2, close inside 0.5, stop beyond 4; equal risk per pair", params: {window: 90, entry: 2.0, exit: 0.5, stop: 4.0}, data: [perpetual daily closes of 10 coins, funding history], traps: [coint_break, selection_pairs, funding_basis, costs], regime: "works while relationships hold; listings and narratives break them", verification: "unverified", worst: "several spreads break at once in a narrative rotation; the pairs share BTC and ETH legs, so they are fewer independent bets than six"}
- {id: cross_exchange_basis, name: Cross-exchange price arbitrage, type: crypto_specific, tier: C, structure: SPR, source: "Makarov Schoar 2020 JFE 'Trading and arbitrage in cryptocurrency markets'", formula: "Buy the coin on the venue where it is cheaper and sell it where it is dearer when the gap net of fees and transfer cost exceeds a threshold; inventory held on both venues", params: {threshold_bps: "fees + transfer cost + 10", inventory: "both venues pre-funded"}, data: [synchronous order books of two venues, withdrawal fees and times], traps: [execution_model, capacity, stale_price, costs], regime: "gaps were large in 2017-2018 and where capital controls bind; small and fleeting on liquid venues", verification: "unverified", worst: "one venue halts withdrawals or fails while it holds half of the inventory; transfers are delayed when the gap is widest"}
- {id: triangular_crypto, name: Triangular arbitrage ETH/BTC vs USDT legs, type: crypto_specific, tier: C, structure: SPR, source: "Law of one price; Makarov Schoar 2020 JFE", formula: "When ETHBTC differs from ETHUSDT/BTCUSDT by more than three taker fees, trade the three legs in the cheap direction at once", params: {threshold: "3 x taker fee + 2 bps"}, data: [tick or order book data of three pairs on one venue], traps: [execution_model, capacity, execution_timing], regime: "almost fully arbitraged on large venues; a test of execution, not of a signal", verification: "unverified", worst: "one leg fills and the others move before they do (legging risk); daily bars cannot show the opportunity"}
- {id: funding_xs_neutral, name: Cross-sectional funding carry (dollar-neutral), type: carry, tier: A, structure: MN, source: "Schmeling Schrimpf Todorov 2023 'Crypto carry' (BIS Working Paper 1087)", formula: "Rank perpetuals by trailing 7-day mean funding; long the lowest third, short the highest third, dollar-neutral; weekly", params: {lookback_days: 7, quantiles: 3, rebalance: weekly}, data: [perpetual daily closes and funding of 12+ coins], traps: [funding_basis, crash_risk, shorting_cost, hidden_beta], regime: "high-funding coins are crowded longs; the short side can squeeze in a mania", verification: "unverified", worst: "the shorted high-funding coins rally hardest in a mania (short squeeze) while funding keeps the long side paying"}
- {id: crypto_bab, name: Betting against beta in crypto, type: factor_premia, tier: A, structure: MN, source: "Frazzini Pedersen 2014 JFE, applied to crypto perpetuals", formula: "Rank coins by 90-day beta to BTC; long the lowest third levered to beta 1, short the highest third de-levered to beta 1; monthly", params: {beta_window: 90, quantiles: 3, rebalance: monthly}, data: [perpetual daily closes of 15+ coins with delistings], traps: [leverage, shorting_cost, survivorship, hidden_beta], regime: "low-beta coins lag in alt seasons", verification: "unverified", worst: "an alt season lifts high-beta coins far above their betas; levered low-beta legs lose with the market in a crash"}
- {id: futures_calendar_spread, name: Dated-futures calendar spread carry, type: carry, tier: B, structure: SPR, source: "Koijen Moskowitz Pedersen Vrugt 2018 JFE 'Carry'", formula: "Long the next quarterly future and short the front when the annualized front-to-next spread is above its 1-year median; roll 5 days before expiry", params: {lookback: "1 year", roll_days: 5}, data: [front and next dated futures daily closes], traps: [roll_yield, funding_basis, execution_timing], regime: "contango steepens in bull phases and flattens in crashes", verification: "unverified", worst: "the curve flips into backwardation in a crash; margin on both legs at one venue"}
- {id: delta_hedged_short_vol, name: Delta-hedged short straddle (variance risk premium), type: short_volatility, tier: C, structure: OPT, source: "Carr Wu 2009 RFS 'Variance risk premiums'", formula: "Sell a 30-day at-the-money straddle on BTC options each month and hedge its delta daily with the perpetual; size to 10% annual vol of the book", params: {tenor_days: 30, hedge: daily, vol_target: 0.10}, data: [option quotes and implied vol, perpetual closes], traps: [short_vol_tail, crash_risk, execution_model, ruin_risk], regime: "earns in calm markets; a vol spike can take years of premium", verification: "unverified", worst: "a gap move larger than the daily hedge can follow: the straddle loses many times the monthly premium (short-volatility tail)"}
- {id: stablecoin_depeg_arb, name: Stablecoin peg arbitrage, type: crypto_specific, tier: C, structure: SPR, source: "Lyons Viswanath-Natraj 2023 JIMF 'What keeps stablecoins stable?'", formula: "Buy a fiat-backed stablecoin below 0.995 and sell above 1.005 against USD, redeeming or minting at par where the account allows", params: {band: 0.005}, data: [stablecoin/USD quotes, redemption terms], traps: [crash_risk, ruin_risk, capacity, execution_model], regime: "mean reversion to the peg is the norm; a broken peg does not revert", verification: "unverified", worst: "the peg breaks for good (an algorithmic stablecoin in 2022): the position is bought at 0.99 and ends near zero"}
- {id: ratio_trend_btc_eth, name: ETH/BTC ratio trend (dollar-neutral), type: trend_following, tier: A, structure: MN, source: "Moskowitz Ooi Pedersen 2012 JFE (time-series momentum) applied to a relative price", formula: "Long ETH and short BTC in equal notional when the ETH/BTC ratio is above its 100-day SMA, the reverse below; weekly", params: {sma: 100, rebalance: weekly}, data: [ETH and BTC perpetual daily closes, funding], traps: [hidden_beta, regime_dependence, funding_basis], regime: "relative trends between the two largest coins; whipsaw in ranges", verification: "unverified", worst: "ETH and BTC decouple in a crash (betas differ): the dollar-neutral book is not beta-neutral and loses on the leg with the higher beta"}
