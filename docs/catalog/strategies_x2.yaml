# Monte-Neo strategy catalog, extension X-2: coverage gaps (draft). Not investment advice.
# Subcategories the 100 and MN-1 left empty or thin: market making, order flow, machine learning, long volatility,
# institutional portfolio construction, hedging overlays, crypto on-chain and listing events, and position-management
# schemes kept as CONTROLS (known to fail: they show what the verifier must catch). Parameters canonical and FROZEN.
# n_trials for the extensions = 100 + every extension entry.
- {id: gueant_mm, name: Inventory-constrained market making, type: market_making, tier: C, structure: MN, source: "Gueant Lehalle Fernandez-Tapia 2013 Math. Financial Economics", formula: "Quote bid and ask around mid with closed-form skew from inventory, risk aversion and order arrival intensity; hard inventory cap Q", params: {gamma: 0.1, inventory_cap: 10, arrival: "fitted A, k per day"}, data: [Level-2 quotes and trades], traps: [execution_model, capacity, short_vol_tail], regime: "earns in range-bound flow; loses to informed flow in trends", verification: "unverified", worst: "a one-way move fills the full inventory cap on the wrong side (adverse selection) before quotes can move"}
- {id: grid_mm_crypto, name: Crypto grid market making, type: market_making, tier: C, structure: MN, source: "Exchange grid-bot practice; Avellaneda Stoikov 2008 for the inventory view", formula: "Resting buy and sell orders every 0.5% around the starting price within a +-10% band; each fill re-posts the opposite order one step away", params: {step: 0.005, band: 0.10}, data: [trade tape or 1-minute bars with high/low], traps: [ruin_risk, short_vol_tail, execution_model], regime: "profits in ranges; a breakout leaves full inventory at a loss", verification: "unverified", worst: "price leaves the band and does not return: the grid holds its full inventory at the band edge"}
- {id: rebate_capture, name: Passive rebate capture at the touch, type: market_making, tier: C, structure: MN, source: "Maker-taker pricing literature; Foucault Kadan Kandel 2013 JF", formula: "Join the best bid and ask only when queue position is in the front third; cancel when the opposite side thins", params: {queue_front: 0.33}, data: [full order-book messages with queue position], traps: [execution_model, capacity, lookahead], regime: "depends on fee tier and latency rank", verification: "unverified", worst: "fills arrive only before adverse moves (markout negative) and the rebate does not cover it"}
- {id: obi_signal, name: Order-book imbalance signal, type: order_flow, tier: C, structure: SPR, source: "Cont Kukanov Stoikov 2014 J. Financial Econometrics", formula: "Order flow imbalance over the last 10 seconds; enter in its direction when above 2 standard deviations, exit after 30 seconds", params: {window_s: 10, threshold_sd: 2.0, hold_s: 30}, data: [Level-1 quote updates with exchange timestamps], traps: [execution_model, costs, lookahead], regime: "a forecast of seconds; costs and latency decide", verification: "unverified"}
- {id: vpin_filter, name: VPIN toxicity filter, type: order_flow, tier: C, structure: SPR, source: "Easley Lopez de Prado O'Hara 2012 RFS", formula: "Volume-synchronized probability of informed trading over 50 buckets; withdraw liquidity or cut exposure above its 90th percentile", params: {buckets: 50, cut_pct: 90}, data: [trade tape with volumes], traps: [lookahead, data_snooping, execution_model], regime: "a risk filter, not a return source; contested evidence", verification: "unverified"}
- {id: lead_lag_crypto, name: BTC-to-altcoin lead-lag, type: stat_arb_pairs, tier: C, structure: MN, source: "Lead-lag literature (Lo MacKinlay 1990 RFS); crypto variants", formula: "When BTC moves more than 0.5% in 1 minute, buy (sell) a basket of altcoins hedged with BTC for 5 minutes", params: {trigger: 0.005, hold_min: 5}, data: [synchronous 1-minute or tick data], traps: [execution_timing, stale_price, costs, capacity], regime: "decays as arbitrageurs arrive", verification: "unverified"}
- {id: index_arb, name: Index (ETF vs constituents) arbitrage, type: stat_arb_pairs, tier: C, structure: SPR, source: "ETF creation-redemption mechanism; Ben-David Franzoni Moussawi 2018 JF", formula: "Trade the ETF against its basket when the gap to the intraday NAV exceeds the creation cost", params: {threshold: "creation cost + 5 bps"}, data: [synchronous ETF and constituent quotes, creation basket], traps: [execution_model, capacity, costs], regime: "available to authorized participants; thin for others", verification: "unverified"}
- {id: dispersion_trade, name: Dispersion trading, type: short_volatility, tier: C, structure: OPT, source: "Driessen Maenhout Vilkov 2009 JF (price of correlation risk)", formula: "Sell index straddles and buy constituent straddles, vega-weighted; monthly", params: {tenor_days: 30, weight: vega}, data: [index and constituent option quotes], traps: [short_vol_tail, execution_model, crash_risk], regime: "earns the correlation premium; loses when correlations jump to one", verification: "unverified", worst: "a crash drives all correlations to one: the short index volatility loses far more than the constituent legs earn"}
- {id: gkx_trees, name: Gradient-boosted cross-sectional forecast, type: ml_forecast, tier: B, structure: MN, source: "Gu Kelly Xiu 2020 RFS", formula: "Boosted trees on 94 firm characteristics plus 8 macro variables predict next-month returns; long top decile, short bottom; annual refit with a validation year", params: {model: "gradient boosted trees", refit: annual, deciles: 10}, data: [point-in-time characteristics, monthly returns], traps: [lookahead, overfit_params, pit_fundamentals, costs], regime: "the paper reports strongest gains in small, illiquid stocks", verification: "unverified", worst: "the long and short deciles reverse together in a factor crash; the model learns the regime it was trained on"}
- {id: tail_hedge_puts, name: Rolling out-of-the-money put hedge, type: long_volatility, tier: B, structure: OPT, source: "Israelov 2017 FAJ \"Pathetic protection\"; Bhansali 2014", formula: "Hold 1-month puts 10% out of the money on the equity index sized to 1% of portfolio value per month, rolled monthly", params: {moneyness: 0.90, budget: 0.01, roll: monthly}, data: [index option quotes, the portfolio], traps: [roll_yield, small_sample, costs], regime: "pays in crashes, costs every calm month", verification: "unverified"}
- {id: vix_term_timing, name: VIX term-structure timing, type: long_volatility, tier: B, structure: SPR, source: "Simon Campasano 2014 J. Derivatives \"The VIX futures basis\"", formula: "Short the front VIX future when it trades above spot VIX by more than 0.1 per day to expiry (contango), long when below (backwardation), hedged with index futures", params: {threshold_per_day: 0.1}, data: [VIX spot and futures, index futures], traps: [short_vol_tail, roll_yield, crash_risk], regime: "the short side dominates; a spike reverses it in a day", verification: "unverified", worst: "a volatility spike while short VIX futures (February 2018)"}
- {id: black_litterman, name: Black-Litterman with momentum views, type: minimum_variance, tier: A, structure: LO, source: "Black Litterman 1992 FAJ; He Litterman 1999", formula: "Equilibrium returns from market weights; one view per asset = sign of 12-month return with confidence from its t-stat; long-only optimum; monthly", params: {tau: 0.05, risk_aversion: 2.5, rebalance: monthly}, data: [multi-asset returns, market weights], traps: [overfit_params, rebalance, hidden_beta], regime: "stays near market weights unless views are strong", verification: "unverified"}
- {id: kelly_fraction, name: Fractional Kelly sizing, type: rebalancing_policy, tier: A, structure: LO, source: "Kelly 1956; Thorp 2006 (Handbook of Asset and Liability Management)", formula: "Exposure = 0.5 x (expected excess return / variance) from 252-day estimates, capped at 2x; daily", params: {fraction: 0.5, window: 252, cap: 2.0}, data: [daily returns, risk-free rate], traps: [leverage, overfit_params, ruin_risk], regime: "estimation error makes full Kelly ruinous; half Kelly is the usual compromise", verification: "unverified"}
- {id: beta_hedge_overlay, name: Beta-hedge overlay, type: vol_managed, tier: A, structure: MN, source: "Standard portfolio practice; Frazzini Pedersen 2014 for beta estimation", formula: "Short index futures equal to the portfolio's 60-day beta times its value; rebalance weekly", params: {window: 60, rebalance: weekly}, data: [portfolio returns, index futures], traps: [hidden_beta, execution_timing, costs], regime: "removes market exposure; betas jump in crashes", verification: "unverified", worst: "beta estimated in calm days is too low in a crash: the hedge is too small exactly when it is needed"}
- {id: mvrv_onchain, name: MVRV on-chain valuation timing, type: crypto_specific, tier: B, structure: LO, source: "Mahmudov Puell 2018 (MVRV ratio); on-chain analytics literature", formula: "Hold BTC when the market-to-realized-value ratio is below 3.5, sell to cash above 3.7", params: {buy_below: 3.5, sell_above: 3.7}, data: [daily realized capitalization from on-chain data], traps: [small_sample, data_snooping, data_vendor], regime: "few cycles in the sample; thresholds chosen after the fact by many", verification: "unverified"}
- {id: listing_effect, name: Exchange listing announcement effect, type: event_merger_arb, tier: B, structure: LO, source: "Event-study literature on crypto exchange listings", formula: "Buy a coin at the first daily close after a major-exchange listing announcement, sell 5 days later", params: {hold_days: 5}, data: [announcement timestamps, daily OHLCV], traps: [lookahead, survivorship, execution_timing], regime: "most of the move happens in minutes after the announcement", verification: "unverified"}
- {id: dex_cex_arb, name: DEX-CEX price arbitrage, type: crypto_specific, tier: C, structure: SPR, source: "Daian et al. 2020 IEEE S&P (\"Flash Boys 2.0\"); Makarov Schoar 2020", formula: "Trade a token on a decentralized pool against a centralized exchange when the gap exceeds gas, pool fee and taker fee", params: {threshold: "gas + fees + 10 bps"}, data: [pool reserves per block, exchange order book], traps: [execution_model, capacity, costs], regime: "competed away by MEV searchers", verification: "unverified", worst: "transactions are front-run or revert after paying gas; the CEX leg is filled, the DEX leg is not"}
- {id: copy_top_traders, name: Copying top leaderboard traders, type: controls, tier: C, structure: LO, source: "Exchange copy-trading products; Apesteguia Oechssler Weidenholzer 2020 Management Science", formula: "Each week copy the 5 traders with the highest 30-day return on a public leaderboard", params: {top: 5, lookback_days: 30}, data: [leaderboard history with delisted traders], traps: [survivorship, data_snooping, small_sample], regime: "CONTROL: selection on past luck; expected to fail out of sample", verification: "unverified"}
- {id: martingale_control, name: Martingale doubling, type: controls, tier: A, structure: LO, source: "Classical gambling system; CONTROL", formula: "After each losing trade double the size of the next; reset after a win", params: {base: 0.01, max_doublings: 8}, data: [daily OHLCV], traps: [ruin_risk, short_vol_tail], regime: "CONTROL: high win rate and a smooth curve until ruin", verification: "unverified", worst: "a run of losses exhausts the doublings: one sequence takes most of the account"}
- {id: averaging_down_control, name: Averaging down without stop, type: controls, tier: A, structure: LO, source: "Retail practice; CONTROL", formula: "Buy an equal amount every 5% fall from the first entry, sell all at 3% above the average price", params: {step: 0.05, target: 0.03}, data: [daily OHLCV], traps: [ruin_risk, short_vol_tail, survivorship], regime: "CONTROL: works until a coin goes to zero", verification: "unverified", worst: "the asset keeps falling (delisting): the position is the largest exactly at the bottom"}
