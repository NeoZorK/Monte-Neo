- {id: bh_eth, name: Buy and hold ETH, type: passive_index, tier: A, source: "Benchmark null", formula: "Hold 100% ETH spot", params: {rebalance: none}, data: [ETH daily OHLCV], traps: [regime_dependence, small_sample], regime: "benchmark null", verification: "unverified"}
