- {id: dca_monthly, name: Monthly dollar-cost averaging, type: dca, tier: A, source: "Constantinides 1979 (critique); common retail practice", formula: "Invest a fixed amount on the first trading day of each month", params: {period: monthly}, data: [price series], traps: [regime_dependence], regime: "compare IRR with lump sum", verification: "unverified"}
- {id: value_averaging, name: Value averaging, type: dca, tier: A, source: "Edleson 1991", formula: "Target portfolio value path grows by fixed amount per period; trade the difference", params: {period: monthly, target_growth: "fixed monthly increment"}, data: [price series], traps: [costs, regime_dependence], regime: "forced buy-low sell-high", verification: "unverified"}
