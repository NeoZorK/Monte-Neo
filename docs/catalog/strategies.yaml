- {id: all_weather, name: All Weather style (static approximation), type: risk_parity, tier: A, source: "Bridgewater public description (Dalio); approximations by third parties", formula: "30% stocks, 40% long Treasuries, 15% intermediate Treasuries, 7.5% gold, 7.5% commodities", params: {w: "30/40/15/7.5/7.5", rebalance: annual}, data: [5 TR series], traps: [rebalance, data_vendor, leverage], regime: "static proxy, not the actual fund", verification: "unverified"}
