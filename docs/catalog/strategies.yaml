# Monte-Neo strategy catalog (draft v0). Not investment advice.
# Parameters are the canonical values from the cited source and are FROZEN: do not tune them.
# tier: A = daily OHLCV from open data; B = needs other data (fundamentals, options, futures curve, macro calendar);
#       C = intraday / tick / order book.
# Sources are cited from the literature by author/year; the source link check is a phase-2 task (see README.md).
- {id: bh_spy, name: Buy and hold equity index, type: passive_index, tier: A, source: "Bogle 1976 (index fund idea); Sharpe 1991", formula: "Hold 100% of the total-return index", params: {rebalance: none}, data: [daily total-return index or ETF], traps: [survivorship, regime_dependence], regime: "all; benchmark null", verification: "unverified"}
