- {id: equal_weight_1n, name: Equal weight 1/N, type: equal_weight, tier: B, source: "DeMiguel Garlappi Uppal 2009", formula: "Equal weight of the universe, monthly rebalance", params: {rebalance: monthly}, data: [point-in-time universe], traps: [survivorship, capacity], regime: "small-cap tilt; needs PIT universe", verification: "unverified"}
