- {id: tsmom_mop, name: Time-series momentum 12 months, type: trend_following, tier: A, source: "Moskowitz Ooi Pedersen 2012 JFE", formula: "Long if past 12-month excess return > 0 else short; hold 1 month; scale to 40% annual vol", params: {lookback_months: 12, hold_months: 1, vol_target: 0.40}, data: [daily futures or spot], traps: [hidden_beta, execution_timing], regime: "strong in trending decades; lags in sideways", verification: "confirmed-secondary: 12m lookback, 1m hold, 40% vol target (AQR data page and summaries, 2026-11-08); primary text not read"}
- {id: tsmom_long_only, name: Time-series momentum long/flat 12m, type: trend_following, tier: A, source: "Moskowitz Ooi Pedersen 2012; long-only variant", formula: "Long if past 12-month return > 0 else cash", params: {lookback_months: 12}, data: [daily spot], traps: [hidden_beta, regime_dependence], regime: "avoids major bear markets with lag", verification: "unverified"}
- {id: hop_trend, name: Multi-horizon trend (1/3/12 month), type: trend_following, tier: A, source: "Hurst Ooi Pedersen 2017 JPM", formula: "Equal-weight sign of 1, 3, 12 month returns, vol-scaled", params: {lookbacks_months: [1, 3, 12], vol_target: 0.10}, data: [daily futures or spot], traps: [hidden_beta, overfit_params], regime: "century-long evidence; diversified markets", verification: "unverified"}
