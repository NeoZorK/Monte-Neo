services:
  monte-neo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: monte-neo
    volumes:
      - ./data:/app/data
      - ./tests:/app/tests
    environment:
      - MONTE_NEO_DATA_DIR=/app/data
      - TERM=xterm-256color
    stdin_open: true
    tty: true
    entrypoint: /bin/bash
    command: -c "sleep infinity"
